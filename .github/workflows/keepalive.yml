# Tiene sveglio il progetto Supabase (piano Free: pausa dopo 7 giorni senza
# richieste API). Usare l'app basta, questo e' il paracadute per le settimane
# di vacanza. Gira ogni due giorni e si puo' lanciare a mano.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 8 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chiamata REST (conta come attivita')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "RPC ping: HTTP $status"
          test "$status" = "200"
          health=$(curl -sS -o /dev/null -w '%{http_code}' "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Auth health: HTTP $health"
